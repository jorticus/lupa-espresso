<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Access-Control-Allow-Origin" content="*"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.min.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script> -->
    <script src=" https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js "></script>
    <link href=" https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css " rel="stylesheet">

    <title>LUPA Espresso Dashboard</title>
    <style>
        .header-controls {
            position:absolute; 
            left: 270px;
            right: 20px;
            height: 50px;
            vertical-align: middle;
            display: flex;
            justify-content: flex-start;
            flex-direction: row;
        }
        .header-controls div {
            padding-right: 20px;
        }
        .chart-status {
            position: absolute;
            top:50%;
            left:50%;
            /* margin-left; */
            text-align: center;
            font-size: 40px;
        }
        h3 {
            margin: 0;
            padding: 0;
            /* font-weight: normal; */
            font-size: inherit;
        }
        .panel {
            text-transform: uppercase;
            display:block;
            text-align: center;
            background: #2d2d2d33;
            padding: 0.5em;
            height: 1em;
            
            border-radius: 10px;
            border: 1px solid #2d2d2d;
        }
        .indicator-on {
            background: #f76504e0;
            border: 1px solid #ffffff77;
        }
        .indicator-ready, .indicator-postbrew {
            background: #26a30096;
            border: 1px solid #ffffff77;
        }
        .indicator-preheat {
            background: #d37f0296;
            border: 1px solid #ffffff77;
        }
        .indicator-brewing {
            background: #007dd196;
            border: 1px solid #ffffff77;
        }
        .indicator-filltank {
            background: #02a2be96;
            border: 1px solid #ffffff77;
        }
        .indicator-stabilizing {
            background: #fff45a96;
            border: 1px solid #ffffff77;
        }
        #lbl_state {
            min-width: 5em;
        }
        .footer {
            position: absolute;
            bottom: 0;
            left:0;
            right:0;
            padding:8px 14px;
            display: flex;
            justify-content: right;
            flex-direction: row;
            background-color: #111113; 
            font-size: small;
        }
    </style>
</head>
<body style="background-color: #111113; color: white; font-family: Zalando Sans SemiExpanded, sans-serif;">
    <div>
        <div class="header-controls" >
            <!-- <div><span id="lbl_off">OFF</span><br/><span id="lbl_on">ON</span></div> -->
            <!-- <div><span>READY</span></div> -->
            <div><span class="panel" id="lbl_state">...</span></div>
            <div><h3>PROFILE</h3><span id="lbl_profile">Manual</span></div>
            <div style="min-width:100px"><h3>PRESSURE</h3><span id="lbl_pressure">-</span></div>
            <div style="min-width:88px"><h3>FLOW</h3><span id="lbl_flow">-</span></div>
            <div style="min-width:78px"><h3>VOLUME</h3><span id="lbl_volume">-</span></div>
            <div style="min-width:40px"><h3>DEV</h3><span id="lbl_deviation">-</span></div>
            <div style="min-width:40px"><h3>EFF</h3><span id="lbl_effort">-</span></div>
            <div style="min-width:40px"><h3>CON</h3><span id="lbl_conductance">-</span></div>
        </div>
        <h2>☕ LUPA Espresso</h2>
    </div>


    <div id="chart1" style="width:100%; height:50vh;"></div>

    <div>
        <div class="header-controls" >
            <div><span class="panel" id="lbl_boiler_indicator"></span></div>
            <div><h3>POWER</h3><span id="lbl_boiler_power">-</span></div>
            <div><h3>HX TEMPERATURE</h3><span id="lbl_boiler_temp">-</span></div>
            <div><h3>HX DELTA</h3><span id="lbl_boiler_temp_delta">-</span></div>
            <div><h3>ESTIMATED</h3><span id="lbl_boiler_temp_est">-</span></div>
        </div>
        <h2 style="padding-left:20px">Boiler</h2>
    </div>
    <div id="chart2" style="width:100%; height:200px;"></div>

    <div class="footer">
        <div>MEM: <span id="lbl_heap">-</span></div>
    </div>

    <script type="module">
        // import uPlot from 'https://cdn.jsdelivr.net/npm/uplot@1.6.32/+esm';

        const gateway = (window.location.protocol == "file:") ? 
            'ws://lupa.lan/ws' :
            `ws://${window.location.hostname}/ws`;

        const interval = 100; // ms

        var websocket = null;
        var timer = null;
        var chart1 = null;
        var chart2 = null;

        const MachineState = [
            'Off',
            'Init',
            'Preheat',
            'Ready',
            'Fault',
            'Brewing',
            'PostBrew',
            'FirmwareUpdate',
            'Sleep',
            'Tuning',
            'FillTank',
            'StabilizePressure',
            'SensorTest',
            'UiTest'
        ];

        const gridColor = '#222';
        const fgColor = '#eee';

        const commonOptions = {
            pxAlign: true,
            legend: {
                // show: false
                // live: false,
                // isolate: true,
                markers: {
                    show: false
                }
            },
            cursor: {
                show: true,
                drag: {
                    setScale: false,
                    x: false,
                    y: false
                }
            },
        };

        const axesOptions = {
            labelSize: 30,
            // labelFont: "bold 12px Arial",
            // font: "12px Arial",
            gap: 5,
            size: 30,
            stroke: fgColor,
            grid: {
                show: true,
                stroke: gridColor,
                width: 2,
                dash: [],
            },
            ticks: {
                show: true,
                stroke: gridColor,
                width: 2,
                dash: [],
                size: 10,
            }
        };

        var time1 = 0.0;
        var time2 = 0.0;
    
        const chart1_t_max_initial = 30;
        var chart1_t_max = chart1_t_max_initial;

        var chart1Options = {
            ...commonOptions,
            scales: {
                x: {
                    time: false,
                    range: (self, min, max) => {
                        if (time1 > chart1_t_max) {
                            chart1_t_max += 10;
                        }
                        return [ 0, chart1_t_max ];
                    }
                },
                y_pressure: {
                    range: [0, 12.0],
                },
                y_flow: {
                    range: [0.0, 12.0], // TODO
                },
                y_score: {
                    range: [0.0, 1.0],
                }
            },
            axes: [
                { ...axesOptions, grid: { show: false } },
                { ...axesOptions, show: true, label: "Pressure", scale: 'y_pressure', size: 20, gap: 0 },
                // { ...axesOptions, grid: { show: false }, show: true, label: "Flow Rate", scale: 'y_flow', size: 20, gap: 0 },
                // { ...axesOptions, show: true, label: "Score", },
            ],
            series: [
                {
                    value: (self, rawValue) => rawValue == null ? '' : rawValue.toFixed(1) + ' s',
                },
                {
                    label: 'Pressure',
                    stroke: '#87b827',
                    value: (self, rawValue) => rawValue == null ? '' : rawValue.toFixed(1) + ' Bar',
                    // width: 1/devicePixelRatio,
                    points: { show: false },
                    scale: 'y_pressure'
                },
                {
                    label: 'Flow',
                    stroke: '#66d9ef',
                    value: (self, rawValue) => rawValue == null ? '' : rawValue.toFixed(1) + ' mL/s',
                    points: { show: false },
                    scale: 'y_flow'
                },
                {
                    label: 'Target',
                    stroke: '#e6f8c1',
                    value: (self, rawValue) => rawValue == null ? '' : rawValue.toFixed(1) + '',
                    points: { show: false },
                    scale: 'y_pressure'
                },

                {
                    label: 'Eff',
                    stroke: '#999',
                    points: { show: false },
                    dash: [3, 2],
                    scale: 'y_score'
                },
                {
                    label: 'Con',
                    stroke: '#999',
                    points: { show: false },
                    dash: [3, 2],
                    scale: 'y_score'
                },
                {
                    label: 'dP',
                    stroke: '#fffc5c',
                    points: { show: false },
                    dash: [3, 2],
                    scale: 'y_score'
                },
            ],
        };

        var chart2_t_min = 0;
        var chart2_t_max = 500;
        const chart2_t_inc = 30;

        var chart2Options = {
            ...commonOptions, 
            scales: {
                x: {
                    time: false,
                    range: (self, min, max) => {
                        if (time2 > chart2_t_max) {
                            chart2_t_min += chart2_t_inc;
                            chart2_t_max += chart2_t_inc;
                        }
                        return [ chart2_t_min, chart2_t_max ];
                    }
                },
                y: {
                    range: [0, 130.0],
                }
            },
            axes: [
                { ...axesOptions, grid: { show: false } },
                { ...axesOptions, show: true, label: "Temperature", }
            ],
            series: [
                {
                    value: (self, rawValue) => rawValue == null ? '' : rawValue.toFixed(1) + ' s',
                },
                {
                    label: 'HX Temperature',
                    stroke: '#f92672',
                    value: (self, rawValue) => rawValue == null ? '' : rawValue.toFixed(1) + ' °C',
                    points: { show: false }
                },
                {
                    label: 'Boiler Temperature',
                    stroke: '#fd971f',
                    value: (self, rawValue) => rawValue == null ? '' : rawValue.toFixed(1) + ' °C',
                    points: { show: false }
                }
            ],
        };

        var chart1 = null;
        var chart2 = null;
        var data1 = null;
        var data2 = null;
        function initChart() {
            const ctx1 = document.getElementById('chart1');
            const ctx2 = document.getElementById('chart2');

            chart1Options.width = ctx1.clientWidth;
            chart1Options.height =  ctx1.clientHeight - 20;

            chart2Options.width = ctx2.clientWidth;
            chart2Options.height =  ctx2.clientHeight - 20;
        
            data1 = [];
            for (var i = 0; i < chart1Options.series.length; i++) {
                data1.push(new Array());
            }
            chart1 = new uPlot(chart1Options, data1, ctx1);

            data2 = [];
            for (var i = 0; i < chart2Options.series.length; i++) {
                data2.push(new Array());
            }
            chart2 = new uPlot(chart2Options, data2, ctx2);
        }

        
        var is_brewing = false;
        function updateChart1(response) {
            if (!chart1) return;

            // Clear chart1 when brew starts
            if (response.pull && !is_brewing) {
                console.log('Reset brew');
                chart1_t_max = chart1_t_max_initial;
                for (var i = 0; i < data1.length; i++) {
                    data1[i] = new Array();
                }
                time1 = 0;
            }
            is_brewing = response.pull;

            const is_incomplete = (time1 > 0 && time1 < (chart1_t_max_initial - 0.1));
            if (is_brewing || is_incomplete) 
            {
                data1[0].push(time1);
                data1[1].push(response.p1);

                data1[2].push(response.flow * 10.0);
                data1[3].push(response.setpoint);

                data1[4].push(response.effort);
                data1[5].push(response.conductance);
                data1[6].push(response.dP + 0.5);

                chart1.setData(data1);

                time1 += 0.1;
            }
        }

        function updateChart2(response) {
            if (!chart2) return;

            data2[0].push(time2);
            data2[1].push(response.t1);
            data2[2].push(response.t2);

            chart2.setData(data2);

            time2 += 0.1;
        }

        // Resize handling: adjust uPlot sizes to container when window changes
        function resizeCharts() {
            const el1 = document.getElementById('chart1');
            const el2 = document.getElementById('chart2');

            if (chart1 && el1) {
                chart1.setSize({
                    width: el1.clientWidth,
                    height: Math.max(20, el1.clientHeight - 20)
                });
            }
  
            if (chart2 && el2) {
                chart2.setSize({
                    width: el2.clientWidth,
                    height: Math.max(20, el2.clientHeight - 20)
                });
            }
        }

        let _resizeTimer = null;
        window.addEventListener('resize', () => {
            _resizeTimer = window.requestAnimationFrame(() => {
                resizeCharts();
            });
        });

        // Ensure charts get sized after initial creation
        window.addEventListener('load', () => setTimeout(resizeCharts, 100));

        var state = null;
        function updateUi(response) {
            if (response.state != state) {
                state = response.state;
                lbl_state.innerText = response.state;
                var className = 'indicator-' + state.toLowerCase();
                lbl_state.className = 'panel ' + className;
            }

            lbl_pressure.innerText  = response.p1.toFixed(2) + ' Bar';
            lbl_flow.innerText      = response.flow.toFixed(2) + ' mL/s';
            lbl_volume.innerText    = response.vol.toFixed(2) + ' mL';
            lbl_deviation.innerText    = response.deviation.toFixed(2);
            lbl_effort.innerText       = response.effort.toFixed(2);
            lbl_conductance.innerText  = response.conductance.toFixed(2);

            lbl_boiler_power.innerText = response.b_pwr.toFixed(0) + ' W';
            lbl_boiler_indicator.className = (response.b_on) ? 'panel indicator-on' : 'panel';

            lbl_boiler_temp.innerText = response.t1.toFixed(1) + ' °C';
            lbl_boiler_temp_est.innerText = (response.t1 > 100) ? (response.t3.toFixed(1) + ' °C') : '-';
            lbl_boiler_temp_delta.innerText = (response.t2 - response.t1).toFixed(1) + ' °C'

            lbl_heap.innerText = response.mem + 'KB';
        }

        function parseSensorPacket(arrayBuffer) {
            const EXPECTED_SIZE = 53; // uint8 + 11 floats + 3 uint8 + uint32 = 53 bytes
            if (arrayBuffer.byteLength < EXPECTED_SIZE) {
                throw new Error(`packet too small (${arrayBuffer.byteLength})`);
            }

            const dv = new DataView(arrayBuffer);
            let off = 0;
            const version   = dv.getUint8(off); off += 1;
            const t1        = dv.getFloat32(off, true); off += 4;
            const t2        = dv.getFloat32(off, true); off += 4;
            const t3        = dv.getFloat32(off, true); off += 4;
            const p1        = dv.getFloat32(off, true); off += 4;
            const flow      = dv.getFloat32(off, true); off += 4;
            const vol       = dv.getFloat32(off, true); off += 4;
            const setpoint  = dv.getFloat32(off, true); off += 4;
            const deviation   = dv.getFloat32(off, true); off += 4;
            const effort    = dv.getFloat32(off, true); off += 4;
            const conductance = dv.getFloat32(off, true); off += 4;
            const dP        = dv.getFloat32(off, true); off += 4;
            const is_flowing= dv.getUint8(off) !== 0; off += 1;
            const pid_i     = dv.getFloat32(off, true); off += 4;
            const pid_d1    = dv.getFloat32(off, true); off += 4;
            const pid_d2    = dv.getFloat32(off, true); off += 4;
            const t_sp      = dv.getFloat32(off, true); off += 4;
            const b_pwr     = dv.getFloat32(off, true); off += 4;
            const b_on      = dv.getUint8(off) !== 0; off += 1;
            const state     = dv.getUint8(off); off += 1;
            const pull      = dv.getUint8(off) !== 0; off += 1;
            const brew      = dv.getUint8(off) !== 0; off += 1;
            const mem       = dv.getUint32(off, true); off += 4;

            return {
                version,
                t1,
                t2,
                t3,
                p1,
                flow,
                vol,
                setpoint,
                deviation,
                effort,
                conductance,
                dP,
                is_flowing,
                pid_i,
                pid_d1,
                pid_d2,
                t_sp,
                b_pwr,
                b_on,
                "state": MachineState[state],
                pull,
                brew,
                mem
            };
        }

        const WS_GET_FRAME = 'get';
        const WS_GET_METADATA = 'meta';
        const WS_GET_PID = 'pid'; // +N
        const WS_GET_BREW_STATS = 'brew';

        function onOpen(event) {
            console.log('Connection opened');
            websocket.send(WS_GET_FRAME);
            // websocket.send(WS_GET_METADATA); // TODO
            if (!timer) {
                timer = setInterval(() => {
                    websocket.send(WS_GET_FRAME);
                }, interval);
            }
        }

        function onMessage(event) {
            const pkt = parseSensorPacket(event.data);
            updateUi(pkt);
            updateChart1(pkt);
            updateChart2(pkt);
        }

        function onClose(event) {
            console.log('Connection closed');
            setTimeout(initWebSocket, 2000);
            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            lbl_state.innerText = 'Disconnected';
        }

        function initWebSocket() {
            websocket = new WebSocket(gateway);
            websocket.binaryType = 'arraybuffer';
            websocket.onopen = onOpen;
            websocket.onclose = onClose;
            websocket.onmessage = onMessage;
        }

        function onLoad() {
            initWebSocket();
            initChart();
        }

        window.addEventListener('load', onLoad);
    </script>
</body>
</html>
